name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: attestrag
          POSTGRES_PASSWORD: attestrag
          POSTGRES_DB: attestrag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U attestrag"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Run the suite against real PostgreSQL (Qdrant runs embedded in-process).
      TEST_DATABASE_URL: postgresql+asyncpg://attestrag:attestrag@localhost:5432/attestrag_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend · typecheck, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker · build & smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: docker compose build
      - name: Start stack (offline provider, no API key needed)
        run: LLM_PROVIDER=fake docker compose up -d --no-build --wait --wait-timeout 180
      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost:3000/api/ready | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS -X POST http://localhost:3000/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"question":"What is the vacation policy?"}' | tee /dev/stderr | grep -q '"status"'
          curl -fsS -o /dev/null http://localhost:3000/analytics
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
