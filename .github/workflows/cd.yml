name: CD

# Publishes production images to GitHub Container Registry on every push to
# main, then (optionally) rolls them out to a cloud VM over SSH.
#
# To enable deployment, configure in Settings -> Secrets and variables -> Actions:
#   variables: DEPLOY_ENABLED=true, DEPLOY_PATH=/opt/attest-rag (optional)
#   secrets:   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
# The server needs Docker + the compose plugin and a `.env` in DEPLOY_PATH.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  publish:
    name: Build & push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/attest-rag' }}
    steps:
      - uses: actions/checkout@v5
      - name: Image prefix
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Upload compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ env.DEPLOY_PATH }}
      - name: Pull and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_PREFIX,IMAGE_TAG,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            export IMAGE_PREFIX IMAGE_TAG
            docker compose pull backend frontend
            docker compose up -d --no-build --remove-orphans --wait
            docker image prune -f
            curl -fsS http://localhost:3000/api/ready
